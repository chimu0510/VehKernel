# SPDX-License-Identifier: GPL-3.0-or-later
# Builds and publishes the multi-arch devcontainer image to GHCR (ADR-0016, spec 0017).
name: Devcontainer

on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/workflows/devcontainer.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: devcontainer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
            arch: amd64
            platform: linux/amd64
          - runs-on: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runs-on }}
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # Content hash over the inputs that define the devcontainer image (ADR-0016,
      # spec 0017). Must stay identical to .github/workflows/ci.yml.
      - name: Compute devcontainer image tag
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner=$(printf '%s' "${OWNER}" | tr '[:upper:]' '[:lower:]')
          hash=$(sha256sum .devcontainer/Dockerfile pyproject.toml uv.lock .python-version | sha256sum | cut -c1-12)
          echo "image=ghcr.io/${owner}/vehkernel-dev" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${hash}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v6
        timeout-minutes: 30
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-3.0-or-later
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Export image digest
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${DIGEST}" ]; then
            echo "Error: build did not produce an image digest" >&2
            exit 1
          fi
          mkdir -p /tmp/digests
          printf '%s\n' "${DIGEST}" > "/tmp/digests/${ARCH}.digest"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}.digest
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest list
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          amd64_digest=$(tr -d '[:space:]' < /tmp/digests/amd64.digest)
          arm64_digest=$(tr -d '[:space:]' < /tmp/digests/arm64.digest)
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}@${amd64_digest}" \
            "${IMAGE}@${arm64_digest}"

      - name: Inspect published manifest
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
