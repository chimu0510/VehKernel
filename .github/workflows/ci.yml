# SPDX-License-Identifier: GPL-3.0-or-later
# Builds every preset inside the devcontainer image, so CI matches local builds (ADR-0018).
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Content hash over the inputs that define the devcontainer image (ADR-0016,
      # spec 0017). Must stay identical to .github/workflows/devcontainer.yml.
      - name: Compute devcontainer image tag
        id: devcontainer
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner=$(printf '%s' "${OWNER}" | tr '[:upper:]' '[:lower:]')
          hash=$(sha256sum .devcontainer/Dockerfile pyproject.toml uv.lock .python-version | sha256sum | cut -c1-12)
          echo "image=ghcr.io/${owner}/vehkernel-dev" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${hash}" >> "$GITHUB_OUTPUT"

      - name: Pull or build devcontainer image
        timeout-minutes: 30
        env:
          IMAGE_REF: ${{ steps.devcontainer.outputs.image }}:${{ steps.devcontainer.outputs.tag }}
        run: |
          set -euo pipefail
          if docker pull "${IMAGE_REF}"; then
            docker tag "${IMAGE_REF}" vehkernel-dev:latest
          else
            echo "Pre-built image ${IMAGE_REF} not available; building locally."
            docker build -t vehkernel-dev:latest -f .devcontainer/Dockerfile .
          fi

      - name: Build presets, run L0 checks and host tests
        run: |
          docker run --rm -v "$PWD:/work" -w /work vehkernel-dev:latest bash -eo pipefail -c '
            # Fallback in case an older image without system-wide safe.directory is used.
            git config --global --add safe.directory /work
            for preset in c50c-v1_1 c50c-v1_1-bringup c50c-v1_1-examples sitl sitl-examples test fuzz; do
              cmake --preset "$preset"
              cmake --build --preset "$preset"
            done
            # A SITL check judges timing, and a stall of the shared runner can fail it, so a
            # failed test gets a second attempt (docs/guide/testing.md).
            ctest --preset test --repeat until-pass:2
            ctest --preset sitl-examples --repeat until-pass:2
          '

      # Upload the board presets' host tools bundles (spec 0014, ADR-0026).
      - name: Keep host tools bundles
        if: matrix.runs-on == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: |
            build/c50c-v1_1/vehkernel-c50c-v1_1-*.tar.gz
            build/c50c-v1_1-bringup/vehkernel-c50c-v1_1-bringup-*.tar.gz
          if-no-files-found: error

      # SITL for the Bridge job's L5 test (spec 0015), built here in the development
      # container, which ROS2's image does not have. The executable needs only the C and
      # C++ runtime of Ubuntu 24.04, which both images share.
      - name: Keep the SITL executable
        uses: actions/upload-artifact@v4
        with:
          name: sitl-${{ matrix.runs-on }}
          path: build/sitl/app/vehkernel-sitl
          if-no-files-found: error

      # Each Link fuzz target for 60 s, three at a time (docs/guide/testing.md).
      - name: Fuzz the Link decoders
        run: |
          docker run --rm -v "$PWD:/work" -w /work vehkernel-dev:latest ctest --preset fuzz

      - name: Keep fuzzer findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.runs-on }}
          path: build/fuzz/test/fuzz/artifacts/
          if-no-files-found: ignore

  # Builds the ROS2 Bridge and runs its unit tests in the official ROS2 image, on both
  # architectures, apart from the development container, which stays free of ROS2
  # (ADR-0027). The image is referenced by the digest of its multi-arch index (ADR-0016).
  # It takes SITL from the build job of the same architecture for the L5 test.
  bridge:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - name: Download SITL
        uses: actions/download-artifact@v4
        with:
          name: sitl-${{ matrix.runs-on }}
          path: sitl

      # clang-tidy with the repository .clang-tidy, every finding an error (ADR-0018).
      # The L5 test runs SITL, whose executable VK_SITL_EXECUTABLE names, with the same
      # second attempt as the SITL checks of the build job: it judges timing on a shared
      # runner (docs/guide/testing.md). The artifact does not keep the executable bit.
      # The script below is one single-quoted bash argument: no apostrophes in it.
      - name: Build and test the Bridge with colcon
        timeout-minutes: 30
        run: |
          chmod +x sitl/vehkernel-sitl
          docker run --rm -v "$PWD:/work" -w /work/bridge \
            -e VK_SITL_EXECUTABLE=/work/sitl/vehkernel-sitl \
            ros:jazzy-ros-base@sha256:5147d3ae250ce754afd399f6bfec15b33dd4e473ca357e30432a3182031bfad6 \
            bash -eo pipefail -c '
              source /opt/ros/jazzy/setup.bash
              apt-get update
              apt-get install -y --no-install-recommends clang-tidy
              colcon build --cmake-args -DVK_CLANG_TIDY=ON
              colcon test --ctest-args --repeat until-pass:2
              colcon test-result --verbose
            '

  # Tests bundled host tools on Python 3.10 outside the devcontainer (spec 0014 Seam B, ADR-0026).
  host-tools-py310:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          name: bundles
          path: bundles

      # Check out repository to extract a test-only copy of the unit tests (spec 0014).
      - name: Check out test-only copy of host tool tests
        uses: actions/checkout@v4
        with:
          path: repo-checkout

      - name: Unpack bundle and place tests
        run: |
          set -euo pipefail
          c50c_tarball=$(find bundles -name "vehkernel-c50c-v1_1-*.tar.gz" ! -name "*bringup*" | head -n 1)
          if [ -z "$c50c_tarball" ]; then
            echo "Error: c50c-v1_1 bundle tarball not found" >&2
            exit 1
          fi
          mkdir -p bundle
          tar -xzf "$c50c_tarball" -C bundle --strip-components=1
          cp -r repo-checkout/tools/link/tests bundle/tools/link/tests
          cp -r repo-checkout/tools/log/tests bundle/tools/log/tests
          cp -r repo-checkout/tools/flash/tests bundle/tools/flash/tests
          cp -r repo-checkout/tools/setup/tests bundle/tools/setup/tests
          cp repo-checkout/tools/bundle/tests/requirements-py310.txt .
          rm -rf repo-checkout

      # Pinned Python 3.10 runtime (ADR-0016, spec 0014).
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.22'

      # Install runtime and test dependencies pinned to exact versions (ADR-0016).
      - name: Install dependencies
        run: pip install --no-deps -r requirements-py310.txt

      # Run unit tests on Python 3.10 from the unpacked bundle (spec 0014 Seam B, ADR-0026, spec 0017).
      # The tools the bundle leaves out have their tests left out too: replay.py needs
      # the native replay binary, deploy.py runs on the development host (#199), and
      # test_templates.py asserts on repository-only ruff.toml; ctest runs all three in
      # the build job.
      - name: Run host tool unit tests on Python 3.10
        working-directory: bundle
        env:
          PYTHONPATH: ${{ github.workspace }}/bundle/tools/link:${{ github.workspace }}/bundle/tools/log:${{ github.workspace }}/bundle/generated/schema/python
          VK_MSG_PYTHON_DIR: ${{ github.workspace }}/bundle/generated/schema/python
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pytest -q -p no:cacheprovider \
            --ignore=tools/log/tests/test_replay.py \
            --ignore=tools/flash/tests/test_deploy.py \
            --ignore=tools/setup/tests/test_templates.py \
            tools/link/tests tools/log/tests tools/flash/tests tools/setup/tests

  # Verifies fresh-machine onboarding in clean Ubuntu 24.04 and Debian 12 containers
  # without pre-installed compilers, ROS2, or rosdep state (spec 0017 Seam D, ADR-0028).
  # Base images are referenced by the digest of their multi-arch index (ADR-0016);
  # the Ubuntu 24.04 digest matches .devcontainer/Dockerfile.
  setup-clean-os:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Clean Debian 12 (bookworm) supports --role flash and rejects unsupported roles
      # with exit code 2 (ADR-0027, ADR-0028). Minimal python3 is installed first because
      # debian:bookworm-slim omits Python.
      # The script below is one single-quoted bash argument: no apostrophes in it.
      - name: Verify flash setup on clean Debian 12
        timeout-minutes: 10
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            debian:bookworm-slim@sha256:734a72b3d6142a71993b4bc580ca01d8ca687f77a2c422d96a961d3376b179bc \
            bash -eo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends python3
              python3 -u /repo/tools/setup/vk_setup.py --role flash --yes
              python3 -u /repo/tools/setup/vk_setup.py --role flash --check
              for mode in --check --dry-run; do
                set +e
                out=$(python3 -u /repo/tools/setup/vk_setup.py --role companion "$mode" 2>&1)
                rc=$?
                set -e
                printf "%s\n" "$out"
                test "$rc" -eq 2
                printf "%s\n" "$out" | grep -q "Ubuntu 24.04"
              done
            '

      # Clean Ubuntu 24.04 (noble) has no build-essential, no ROS2, and no initialized
      # rosdep. Minimal python3 is installed first because ubuntu:24.04 omits Python.
      # Runs companion setup end-to-end, builds vehkernel_msgs and vehkernel_bridge
      # from zero, and verifies --check exits 0.
      # The script below is one single-quoted bash argument: no apostrophes in it.
      - name: Verify companion setup and Bridge build on clean Ubuntu 24.04
        timeout-minutes: 30
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac \
            bash -eo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              ! command -v g++ >/dev/null 2>&1
              ! test -d /opt/ros
              ! test -e /etc/ros/rosdep/sources.list.d/20-default.list
              apt-get update
              apt-get install -y --no-install-recommends python3
              python3 -u /repo/tools/setup/vk_setup.py --role companion --yes \
                --repo-dir /repo --workspace /tmp/vk_ws --build-bridge
              test -x /tmp/vk_ws/install/vehkernel_bridge/lib/vehkernel_bridge/bridge
              test -f /tmp/vk_ws/install/vehkernel_msgs/share/vehkernel_msgs/package.xml
              python3 -u /repo/tools/setup/vk_setup.py --role companion --check \
                --workspace /tmp/vk_ws --build-bridge
              python3 -u /repo/tools/setup/vk_setup.py --role companion --check \
                --workspace /tmp/vk_ws
            '
