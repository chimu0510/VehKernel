# Host-side tools for building and checking Vehkernel. Versions are exact and
# resolved through uv.lock (ADR-0016).
[project]
name = "vehkernel-tools"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
    "clang-tidy==21.1.6",
    "cmake==3.31.6",
    "kconfiglib==14.1.0",
    "ninja==1.13.0",
    "pyserial==3.5",
    "pytest==8.4.2",
    "pyulog==1.3.0",
    "reuse[charset-normalizer]==6.2.0",
    "ruff==0.17.5",
]

[tool.uv]
package = false

# Lint of the repository's own Python (ADR-0016: the version is exact, like
# the other tools). No `ruff format`: formatting is not enforced.
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["external", "vendor", "build", "tools/bootloader/external/uploader.py",
                  "tools/generators/tests/**/expected"]

[tool.ruff.lint]
select = ["E", "F", "W", "BLE"]

# Generated, and compared byte for byte with the generator's output.
[tool.ruff.lint.per-file-ignores]
"tools/log/vkulog/formats.py" = ["E501"]
